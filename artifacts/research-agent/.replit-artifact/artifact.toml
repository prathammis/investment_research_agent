kind = "web"
previewPath = "/"
title = "Investment Research Agent"
version = "1.0.0"
id = "artifacts/research-agent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22545

[services.development]
run = "pnpm --filter @workspace/research-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/research-agent", "run", "build" ]
publicDir = "artifacts/research-agent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22545"
BASE_PATH = "/"
